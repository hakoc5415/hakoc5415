<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="POLARA">
  <meta name="theme-color" content="#03050e">
  <meta name="description" content="POLARA — Ride the Northern Lights. Tek parmakla oynanan hipnotik bir kuzey ışığı oyunu.">
  <title>POLARA — Ride the Northern Lights</title>
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="apple-touch-icon" href="./icons/icon-180.png">
  <link rel="icon" type="image/png" sizes="192x192" href="./icons/icon-192.png">
  <link rel="stylesheet" href="./fonts.css">
  <script src="./i18n.js"></script>
  <style>
    html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; background: #03050e; overscroll-behavior: none; position: fixed; inset: 0; width: 100%; }
    * { -webkit-tap-highlight-color: transparent; -webkit-touch-callout: none; }
    input, select, textarea { font-size: 16px !important; }
    a { color: #8ef5c8; text-decoration: none; }
    a:hover { color: #c9a5ff; }
    @keyframes fadeUp { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes softPulse { 0%, 100% { opacity: 0.5; } 50% { opacity: 1; } }
    @keyframes splashText { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes raySpin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
    @keyframes logoWipe { from { clip-path: inset(0 100% 0 0); } to { clip-path: inset(0 -20% 0 0); } }
    @keyframes lineGrow { from { transform: scaleX(0); } to { transform: scaleX(1); } }
    @keyframes floatY { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-7px); } }
    @keyframes rotatePhone { 0%, 15% { transform: rotate(90deg); } 55%, 100% { transform: rotate(0deg); } }
    @keyframes langPop { from { opacity: 0; transform: translateY(-6px) scale(0.96); } to { opacity: 1; transform: translateY(0) scale(1); } }
    .lang-item:hover { background: rgba(142,245,200,0.08) !important; }
    .ach-chip:hover { transform: translateY(-2px); }
    #ui { position: absolute; inset: 0; }
    #ui:empty { pointer-events: none; }
  </style>
</head>
<body>
  <div id="stage" style="position: fixed; inset: 0; background: #03050e; touch-action: none; user-select: none; -webkit-user-select: none; font-family: 'Space Grotesk', sans-serif; cursor: pointer;">
    <canvas id="cv" style="position: absolute; inset: 0; width: 100%; height: 100%; display: block;"></canvas>
    <div id="ui"></div>
  </div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
