name: GitHub Pages

# main'e her push'ta oyunu + gizlilik politikasını GitHub Pages'e yayınlar:
#   https://hakoc5415.github.io/hakoc5415/            → oyun (tarayıcıda oynanabilir)
#   https://hakoc5415.github.io/hakoc5415/privacy.html → gizlilik politikası (store başvuruları için)
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
